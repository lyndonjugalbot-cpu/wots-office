# Platform defaults. Offices can override some per org (organizations.settings).
# Env vars override: DRY_RUN, DATABASE_URL, WOTS_DATA_DIR, NOTIFY_WEBHOOK. Models/prices: models.yaml.

# true = no external sends, no deploys, and LLM spend capped at dry_run_llm_cap_usd (spec §2.6)
dry_run: true
# Nothing is emailed without a CEO click until Phase 6 (spec §2.3)
auto_send: false

database_url: sqlite:///data/wots.db
data_dir: data
# Used for "today" in budgets and reports; the CEO is in New Zealand
timezone: Pacific/Auckland

atlas:
  tick_seconds: 30
  max_jobs_per_org_per_tick: 10   # per office, so one busy office can't starve the others
  workers: 4                       # in-process job workers for `wots run`
  lease_seconds: 600            # a claim expires after this, releasing a crashed agent's lead
  max_retries: 3                # retries after the first failure, then ESCALATED
  retry_backoff_seconds: 30     # 30s, 60s, 120s ...
  max_fix_count: 3              # NEEDS_FIX -> ESCALATED when fix_count reaches this

wip:
  max_wip: 2
  wip_mode: batch               # batch: new work only when all current leads are APPROVED; rolling: whenever below max_wip
  fairness_window_days: 7       # "fewer total leads this week" when choosing between free designers

budget:
  daily_llm_budget_usd: 5.00
  dry_run_llm_cap_usd: 1.00

outreach:
  daily_send_cap: 20
  followup_after_days: 5

previews:
  preview_ttl_days: 30

retention_days: 180

notify:
  webhook: null                 # Telegram or Discord webhook URL; or set NOTIFY_WEBHOOK
  on_statuses: [READY_FOR_APPROVAL, PITCH_DRAFTED, ESCALATED]

qa:
  lighthouse: {accessibility: 90, performance: 80, seo: 80}   # SEO ignores noindex (spec §7)
  run_lighthouse: true
  check_external_links: true      # unreachable external links are reported as medium, not a fail

research:
  # Google Places is off: its terms don't allow saving business names/addresses (Maps Platform ToS 3.2.3)
  places_enabled: false
  places_cost_per_request_usd: 0.035   # Places Text Search incl. phone + website; check Google Cloud's current pricing
  max_places_requests_per_day: 100     # per office; a 50-lead search usually needs 5-15 requests
  page_size: 20
  request_timeout_seconds: 10
  website_check_timeout_seconds: 6
  nominatim_url: https://nominatim.openstreetmap.org/search    # OpenStreetMap: finds the town
  overpass_urls:                       # OpenStreetMap: finds businesses in a town (tried in turn when busy)
    - https://overpass-api.de/api/interpreter
    - https://overpass.private.coffee/api/interpreter
  max_osm_requests_per_day: 200        # free public servers; keep use light
  companies_house_page_size: 100       # UK company search by trade (SIC code)
