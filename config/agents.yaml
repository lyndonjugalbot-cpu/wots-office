# The team (spec §4). Each agent owns one status per scope and moves leads forward.
#
#   class:          implementation (module:Class); agents are added phase by phase
#   enabled:        Atlas only dispatches enabled agents whose class exists
#   owns:           scope -> status this agent picks up
#   assigned_only:  only picks up leads Atlas assigned to it (designers)
#   pool:           designers Atlas assigns from, per scope
#   uses_llm:       paused by the budget guard when the daily budget is spent
#
# Models (open decision §13.7, confirm with the CEO): a fast model for extraction and
# classification, a stronger one for copy, briefs and design.

defaults:
  batch_size: 5
  fast_model: claude-haiku-4-5
  strong_model: claude-opus-5

agents:
  scout:
    class: wots.agents.scout:Scout
    enabled: false              # Phase 2
    scope: [website]
    owns: {}
    uses_llm: false
  scout_ads:
    class: wots.agents.scout_ads:ScoutAds
    enabled: false              # Phase 5
    scope: [ad_refresh]
    owns: {}
    uses_llm: false
  ledger:
    class: wots.agents.ledger:Ledger
    enabled: true              # Phase 1: enrichment only; verification in Phase 2
    scope: [website, ad_refresh]
    owns: {website: NEW, ad_refresh: NEW}
    uses_llm: false
    model: fast
  quill:
    class: wots.agents.quill:Quill
    enabled: true              # Phase 1
    scope: [website]
    owns: {website: ENRICHED}
    uses_llm: true
    model: strong
  lens:
    class: wots.agents.lens:Lens
    enabled: false              # Phase 5
    scope: [ad_refresh]
    owns: {ad_refresh: ENRICHED}
    uses_llm: true
    model: strong
  iris:
    class: wots.agents.graphic_designer:GraphicDesigner
    enabled: true              # Phase 1: text logo + palette; real design in Phase 3
    scope: [website]              # ad_refresh joins in Phase 5
    owns: {website: COPY_READY}
    assigned_only: []
    pool: []
    style_profile: "clean, flat, brand-colour led"
    uses_llm: false
    model: strong
  juno:
    class: wots.agents.graphic_designer:GraphicDesigner
    enabled: false              # Phase 5
    scope: [ad_refresh]
    owns: {ad_refresh: ASSIGNED}
    assigned_only: [ad_refresh]
    pool: [ad_refresh]
    style_profile: "bold type, high contrast, playful"
    uses_llm: true
    model: strong
  pixel:
    class: wots.agents.web_designer:WebDesigner
    enabled: true              # Phase 1
    scope: [website]
    owns: {website: ASSIGNED}
    assigned_only: [website]
    pool: [website]
    style_profile: "clean & modern"
    uses_llm: true               # builds from templates; calls Claude only to act on CEO notes or proofread issues
    model: strong
  nova:
    class: wots.agents.web_designer:WebDesigner
    enabled: true              # Phase 1
    scope: [website]
    owns: {website: ASSIGNED}
    assigned_only: [website]
    pool: [website]
    style_profile: "bold & warm"
    uses_llm: true               # builds from templates; calls Claude only to act on CEO notes or proofread issues
    model: strong
  hawk:
    class: wots.agents.hawk:Hawk
    enabled: true              # Phase 1: website QA
    scope: [website]              # ad QA joins in Phase 5
    owns: {website: IN_QA}
    uses_llm: true
    model: fast
  dock:
    class: wots.agents.dock:Dock
    enabled: false              # Phase 3
    scope: [website]
    owns: {website: APPROVED}
    uses_llm: false
  echo:
    class: wots.agents.echo:Echo
    enabled: false              # Phase 4
    scope: [website, ad_refresh]
    owns: {website: PREVIEW_DEPLOYED, ad_refresh: APPROVED}
    uses_llm: true
    model: strong
