key: lead_researcher
version: 1
display_name: Lead Researcher
category: research
description: Finds businesses from approved sources (our scraper adapter for the internal office, Google Places API) and hands imported leads to verification.
impl: wots.employees.impl.lead_researcher:LeadResearcher
task_kinds: [research_leads]
default_model: fast
tools: [places_api, internal_scraper]
config_schema:
