[alembic]
script_location = migrations
# Import the app from the repo even if macOS hides the editable-install .pth file
prepend_sys_path = .
path_separator = os
# Overridden at runtime from config/settings.yaml (or DATABASE_URL)
sqlalchemy.url = sqlite:///data/wots.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
